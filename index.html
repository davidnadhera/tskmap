<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSK - mapa modelových intenzit</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
  :root{
    --panel-bg:#ffffff;
    --border:#dfe3e8;
    --text:#1f2937;
    --muted:#6b7280;
    --accent:#2563eb;
    --accent-dark:#1d4ed8;
  }
  html,body{ margin:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--text); }
  #map{ position:absolute; top:0; bottom:0; left:340px; right:0; }

  #sidebar{
    position:absolute; top:0; bottom:0; left:0; width:340px;
    background:var(--panel-bg); border-right:1px solid var(--border);
    display:flex; flex-direction:column; z-index:1000; overflow-y:auto;
  }
  .sb-section{ padding:14px 16px; border-bottom:1px solid var(--border); }
  .sb-section h1{ font-size:15px; margin:0 0 2px; }
  .sb-section .sub{ font-size:12px; color:var(--muted); margin:0; }
  .sb-section h2{ font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 8px; }

  select, button, input[type=text], textarea{
    font-family:inherit; font-size:13px; border:1px solid var(--border); border-radius:6px;
    padding:7px 9px; width:100%; box-sizing:border-box; background:#fff; color:var(--text);
  }
  button{ cursor:pointer; background:var(--accent); color:#fff; border:none; font-weight:600; }
  button:hover{ background:var(--accent-dark); }
  button.secondary{ background:#fff; color:var(--text); border:1px solid var(--border); }
  button.secondary:hover{ background:#f3f4f6; }
  button:disabled{ opacity:.5; cursor:not-allowed; }

  label.row{ display:flex; align-items:center; gap:8px; font-size:13px; margin:8px 0; cursor:pointer; }
  label.row input{ width:auto; }

  #legend{ font-size:12px; }
  .legend-item{ display:flex; align-items:center; gap:8px; margin:4px 0; }
  .swatch{ width:16px; height:10px; border-radius:2px; flex:none; }

  .field{ margin-bottom:8px; }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:3px; }

  #status{ font-size:12px; color:var(--muted); padding:0 16px 14px; }

  /* Leaflet popup styling */
  .leaflet-popup-content-wrapper{ border-radius:8px; }
  .leaflet-popup-content{ margin:12px 14px; width:280px !important; }
  .popup-title{ font-weight:700; font-size:14px; margin-bottom:6px; }
  table.attr-table{ width:100%; border-collapse:collapse; font-size:12px; margin-bottom:10px; }
  table.attr-table td{ padding:3px 0; }
  table.attr-table td.k{ color:var(--muted); }
  table.attr-table td.v{ text-align:right; font-variant-numeric:tabular-nums; }

  .notes-list{ max-height:150px; overflow-y:auto; margin-bottom:8px; }
  .note-item{ background:#f8f9fb; border-radius:6px; padding:6px 8px; margin-bottom:6px; font-size:12px; }
  .note-item .meta{ color:var(--muted); font-size:11px; margin-bottom:2px; }
  .note-empty{ color:var(--muted); font-size:12px; margin-bottom:8px; }

  .note-form input, .note-form textarea{ margin-bottom:6px; }
  .note-form textarea{ resize:vertical; min-height:50px; }
  .note-form .hint{ font-size:11px; color:var(--muted); margin-bottom:6px; }

  .usek-label{
    background:rgba(255,255,255,.92); border:1px solid var(--border); border-radius:4px;
    padding:1px 5px; font-size:11px; font-weight:600; color:var(--text); box-shadow:none;
  }
  .usek-label::before{ display:none; }

  #toast{
    position:absolute; bottom:16px; left:356px; z-index:2000;
    background:#111827; color:#fff; padding:8px 14px; border-radius:6px; font-size:12px;
    opacity:0; transition:opacity .2s; pointer-events:none;
  }
  #toast.show{ opacity:1; }
</style>
</head>
<body>

<div id="sidebar">

  <div class="sb-section">
    <h1>Očekávané dopady zprovoznění PO 511, přeložky I/12 a dalších staveb</h1>
    <p class="sub">Vizualizace modelových intenzit</p>
  </div>

  <div class="sb-section">
    <h2>Režim zobrazení</h2>
    <select id="modeSelect">
      <option value="ss">Intenzity – současný stav</option>
      <option value="vyhl">Intenzity – výhledový stav</option>
      <option value="diff">Rozdíl (výhled − současnost)</option>
      <option value="diff_pct">Rozdíl v procentech</option>
    </select>

    <h2 style="margin-top:12px;">Vozidla</h2>
    <select id="vehicleSelect">
      <option value="total">Všechna vozidla</option>
      <option value="heavy">Jen nad 3,5 t</option>
    </select>

    <label class="row">
      <input type="checkbox" id="labelsToggle" checked>
      Zobrazit popisky s hodnotami
    </label>

    <label class="row">
      <input type="checkbox" id="notesFilter">
      Zobrazit jen úseky s poznámkou
    </label>
  </div>

  <div class="sb-section">
    <h2>Legenda</h2>
    <div id="legend"></div>
  </div>

  <div class="sb-section">
    <h2>Vaše jméno</h2>
    <div class="field">
      <input type="text" id="authorName" placeholder="Jméno (zobrazí se u vašich poznámek)">
    </div>
    <p class="sub" style="margin-top:6px;">Jméno se uloží jen v tomto prohlížeči a předvyplní se u nových poznámek.</p>
  </div>

  <div style="flex:1"></div>
  <div id="status">Načítám data…</div>
</div>

<div id="map"></div>
<div id="toast"></div>

<script>
/* ======================================================================
   KONFIGURACE — uprav před nasazením
   ====================================================================== */
const CONFIG = {
  // Cesta k CSV souboru s úseky (relativně k index.html)
  CSV_URL: 'data.csv',

  // URL nasazeného Google Apps Script Web Appu (viz README / Code.gs).
  // Appka přes ni čte i zapisuje poznámky - Sheet samotný zůstává
  // soukromý, přístup k němu má jen tvůj Google účet, pod kterým je
  // skript nasazený.
  APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbzDhFA4JkzN71s0HgWbqbMO3B4REHu3-td4mLHk0Y0IbQixH5G3PnfJ9LucWWwpnYiEfQ/exec',

  MAP_CENTER: [50.045, 14.47],
  MAP_ZOOM: 12,
};

/* ======================================================================
   STAV APLIKACE
   ====================================================================== */
let map, geoLayer;
let features = [];              // pole {id, props:{...}, latlngs:[...]}
let notesByUsek = new Map();    // UsekId -> [ {autor, text, cas} ]
let currentMode = 'ss';         // ss | vyhl | diff | diff_pct
let currentVehicle = 'total';   // total | heavy

const COLOR_PURPLE = '#8e44ad';
const COLOR_GREEN = '#2e8b57';
const DIFF_RAMP_NEG = '#2166ac';
const DIFF_RAMP_POS = '#b2182b';
const COLOR_NEW = '#f59e0b';

const MIN_WEIGHT = 2;
const MAX_WEIGHT = 9;

/* ======================================================================
   NAČTENÍ A PARSOVÁNÍ CSV
   ====================================================================== */
function parseNumber(s) {
  if (s === undefined || s === null) return 0;
  const cleaned = String(s).replace(/\s|\u00a0/g, '').replace(',', '.');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

// WKT "LINESTRING(lon lat,lon lat,...)" -> pole [lat,lon] pro Leaflet
function wktLineToLatLngs(wkt) {
  const inner = wkt.replace(/^LINESTRING\s*\(/i, '').replace(/\)\s*$/, '');
  return inner.split(',').map(pair => {
    const [lon, lat] = pair.trim().split(/\s+/).map(Number);
    return [lat, lon];
  });
}

function loadCsv() {
  return new Promise((resolve, reject) => {
    Papa.parse(`${CONFIG.CSV_URL}?v=${Date.now()}`, {
      download: true,
      delimiter: ';',
      complete: (result) => {
        try {
          // první řádek je hlavička (i když neobvykle pojmenovaná) -> přeskočit
          const parsed = result.data.slice(1)
            .filter(r => r.length >= 8 && r[7] && r[7].trim().length > 0)
            .map(r => {
              const props = {
                id: r[1].trim(),                 // sloupec "No" v hlavičce = skutečné ID úseku
                total_ss: parseNumber(r[2]),
                total_vyhl: parseNumber(r[3]),
                heavy_ss: parseNumber(r[4]),
                heavy_vyhl: parseNumber(r[5]),
                typ: parseNumber(r[6]),          // TypUseku - určuje barvu v režimech "Intenzity"
              };
              return { id: props.id, props, latlngs: wktLineToLatLngs(r[7]) };
            });
          resolve(parsed);
        } catch (e) { reject(e); }
      },
      error: reject,
    });
  });
}

/* ======================================================================
   VÝPOČET HODNOT PRO AKTUÁLNÍ REŽIM
   ====================================================================== */
// vrací { value, isNew, colorValue } kde:
// - value = hodnota k zobrazení v popisku (intenzita / rozdíl / rozdíl v %)
// - isNew = úsek měl v současném stavu nulovou intenzitu (nový úsek)
// - forWeight = hodnota použitá pro škálování tloušťky (vždy >= 0)
function computeForFeature(f) {
  const ss = f.props[currentVehicle + '_ss'];
  const vyhl = f.props[currentVehicle + '_vyhl'];
  const isNew = ss === 0 && vyhl > 0;

  if (currentMode === 'ss') {
    return { value: ss, forWeight: ss, isNew: false };
  }
  if (currentMode === 'vyhl') {
    return { value: vyhl, forWeight: vyhl, isNew: false };
  }
  if (currentMode === 'diff') {
    const diff = vyhl - ss;
    return { value: diff, forWeight: Math.abs(diff), isNew };
  }
  // diff_pct
  if (ss === 0) {
    return { value: null, forWeight: null, isNew: true };
  }
  const pct = ((vyhl - ss) / ss) * 100;
  // Škálování tloušťky pro procenta je symetrické kolem poměru 1:1 -
  // použije se log2 poměru vyhl/ss, takže nárůst na dvojnásobek (+100 %,
  // poměr 2) vyjde tloušťkou stejně jako pokles na polovinu (-50 %,
  // poměr 0,5), nárůst na trojnásobek (+200 %) stejně jako pokles o
  // 66,7 % (poměr 1/3) atd.
  const ratio = vyhl / ss;
  const logRatio = Math.log2(ratio);
  return { value: pct, forWeight: Math.abs(logRatio), isNew: false };
}

// Absolutní a relativní změna (celkem i nákladní) - nezávisí na zvoleném
// režimu/vozidlech, používá se v popupu.
function computeChanges(f) {
  const p = f.props;
  function one(ss, vyhl) {
    const diff = vyhl - ss;
    const isNew = ss === 0 && vyhl > 0;
    const pct = ss !== 0 ? (diff / ss) * 100 : null;
    return { diff, pct, isNew };
  }
  return {
    total: one(p.total_ss, p.total_vyhl),
    heavy: one(p.heavy_ss, p.heavy_vyhl),
  };
}

function isPurpleType(typ) {
  return (typ >= 10 && typ <= 20) || (typ >= 40 && typ <= 59);
}

// Škálování tloušťky podle percentilu hodnoty v rozložení všech úseků
// (místo lineárního škálování vůči maximu). Tím se zohlední skutečné
// rozložení hodnot - když jeden úsek má extrémní hodnotu, ostatní úseky
// se navzájem dál odliší podle svého pořadí, místo aby všechny vyšly
// prakticky stejně tence kvůli jedinému outlieru.
function makeWeightScale(forWeightValues) {
  const sorted = forWeightValues
    .filter(v => v !== null && v !== undefined && !isNaN(v))
    .sort((a, b) => a - b);
  const n = sorted.length;

  function lowerBound(v) {
    let lo = 0, hi = n;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (sorted[mid] < v) lo = mid + 1; else hi = mid; }
    return lo;
  }
  function upperBound(v) {
    let lo = 0, hi = n;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (sorted[mid] <= v) lo = mid + 1; else hi = mid; }
    return lo;
  }

  return function (absValue) {
    if (absValue === null || absValue === undefined || isNaN(absValue)) return MAX_WEIGHT; // nový úsek - zvýraznit
    if (n <= 1) return MAX_WEIGHT;
    // percentil = průměr dolní a horní pozice hodnoty v seřazeném poli
    // (řeší shodné hodnoty spravedlivě)
    const rank = (lowerBound(absValue) + upperBound(absValue)) / 2;
    const p = rank / (n - 1);
    const w = MIN_WEIGHT + p * (MAX_WEIGHT - MIN_WEIGHT);
    return Math.max(MIN_WEIGHT, Math.min(MAX_WEIGHT, w));
  };
}

function styleForMetric() {
  const computed = features.map(f => ({ f, c: computeForFeature(f) }));
  const weightScale = makeWeightScale(computed.map(x => x.c.forWeight));

  renderLegend();

  const byId = new Map(computed.map(x => [x.f.id, x.c]));

  return function (feature) {
    const c = byId.get(feature.id);
    let color;
    if (currentMode === 'ss' || currentMode === 'vyhl') {
      color = isPurpleType(feature.props.typ) ? COLOR_PURPLE : COLOR_GREEN;
    } else if (c.isNew) {
      // nový úsek - odlišná barva místo řazení k nárůstu/poklesu
      color = COLOR_NEW;
    } else {
      color = c.value >= 0 ? DIFF_RAMP_POS : DIFF_RAMP_NEG;
    }
    return {
      color,
      weight: weightScale(c.forWeight),
      opacity: 0.9,
      computed: c,
    };
  };
}

function renderLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = '';

  if (currentMode === 'ss' || currentMode === 'vyhl') {
    el.insertAdjacentHTML('beforeend',
      `<div class="legend-item"><span class="swatch" style="background:${COLOR_PURPLE}"></span>Nadřazená silniční síť</div>`);
    el.insertAdjacentHTML('beforeend',
      `<div class="legend-item"><span class="swatch" style="background:${COLOR_GREEN}"></span>Ostatní silniční síť</div>`);
    return;
  }

  const rows = [
    [DIFF_RAMP_POS, 'Nárůst'],
    [DIFF_RAMP_NEG, 'Pokles'],
    [COLOR_NEW, 'Nový úsek'],
  ];
  rows.forEach(([color, label]) => {
    el.insertAdjacentHTML('beforeend',
      `<div class="legend-item"><span class="swatch" style="background:${color}"></span>${label}</div>`);
  });
}

/* ======================================================================
   VYKRESLENÍ MAPY
   ====================================================================== */
function initMap() {
  map = L.map('map').setView(CONFIG.MAP_CENTER, CONFIG.MAP_ZOOM);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors',
  }).addTo(map);
  // pri zmene zoomu se meni vzdalenost popisku na obrazovce v pixelech,
  // takze je potreba prepocitat, ktere se preskoci kvuli prekryvu
  map.on('zoomend', () => redraw());
}

function passesNotesFilter(f) {
  if (!document.getElementById('notesFilter').checked) return true;
  const notes = notesByUsek.get(String(f.id)) || [];
  return notes.length > 0;
}

function midpoint(latlngs) {
  // střední bod podle délky linie (ne jen prostřední vrchol), ať popisek
  // sedí i u dlouhých/nerovnoměrně vedených úseků
  let total = 0;
  const segLens = [];
  for (let i = 0; i < latlngs.length - 1; i++) {
    const d = map.distance(latlngs[i], latlngs[i + 1]);
    segLens.push(d);
    total += d;
  }
  let acc = 0;
  const half = total / 2;
  for (let i = 0; i < segLens.length; i++) {
    if (acc + segLens[i] >= half) {
      const t = (half - acc) / (segLens[i] || 1);
      const [lat1, lng1] = latlngs[i];
      const [lat2, lng2] = latlngs[i + 1];
      return [lat1 + (lat2 - lat1) * t, lng1 + (lng2 - lng1) * t];
    }
    acc += segLens[i];
  }
  return latlngs[Math.floor(latlngs.length / 2)];
}

// text popisku přímo na mapě - nikdy nepíše "Nový úsek" (viz popup),
// u procentuálního rozdílu na novém úseku se nezobrazuje vůbec (dělení nulou)
function tooltipLabelText(c) {
  if (c.value === null || isNaN(c.value)) return '';
  if (currentMode === 'diff_pct') {
    const sign = c.value > 0 ? '+' : '';
    return `${sign}${c.value.toFixed(1).replace('.', ',')} %`;
  }
  const sign = (currentMode === 'diff' && c.value > 0) ? '+' : '';
  return `${sign}${fmt(c.value)}`;
}

/* ======================================================================
   ZAMEZENÍ PŘEKRÝVÁNÍ POPISKŮ
   Popisky se vybírají chamtivým algoritmem: seřadí se podle důležitosti
   (tloušťka linie) a přidávají se jen ty, jejichž obdélník na obrazovce
   nekoliduje s už umístěnými popisky. Přepočítává se při každém zoomu.
   ====================================================================== */
function placeNonOverlappingLabels(candidates, group) {
  const sorted = [...candidates].sort((a, b) => b.weight - a.weight);
  const placedBoxes = [];

  sorted.forEach(cand => {
    const pt = map.latLngToContainerPoint(cand.latlng);
    const w = 14 + cand.text.length * 6.2;
    const h = 18;
    const box = { x0: pt.x - w / 2, y0: pt.y - h / 2, x1: pt.x + w / 2, y1: pt.y + h / 2 };

    const overlaps = placedBoxes.some(b =>
      box.x0 < b.x1 && box.x1 > b.x0 && box.y0 < b.y1 && box.y1 > b.y0
    );
    if (overlaps) return;

    placedBoxes.push(box);
    L.tooltip({
      permanent: true,
      direction: 'center',
      className: 'usek-label',
      opacity: 0.95,
    })
      .setLatLng(cand.latlng)
      .setContent(cand.text)
      .addTo(group);
  });
}

function redraw() {
  const styleFn = styleForMetric();
  if (geoLayer) map.removeLayer(geoLayer);
  const showLabels = document.getElementById('labelsToggle').checked;

  const group = L.layerGroup();
  const labelCandidates = [];

  features.forEach(f => {
    if (!passesNotesFilter(f)) return;
    const style = styleFn(f);
    const c = style.computed;

    // v režimech "Intenzity" schovej úseky s nulovou hodnotou zvolené veličiny
    if ((currentMode === 'ss' || currentMode === 'vyhl') && c.value === 0) return;

    const hasNotes = (notesByUsek.get(String(f.id)) || []).length > 0;
    if (hasNotes) {
      // vizuální odlišení úseků s poznámkou: jemný obrys navrch
      L.polyline(f.latlngs, { color: '#111827', weight: style.weight + 3, opacity: 0.15 }).addTo(group);
    }
    const line = L.polyline(f.latlngs, style);
    line.on('click', () => openPopup(line, f));
    line.addTo(group);

    if (showLabels) {
      const text = tooltipLabelText(c);
      if (text) {
        labelCandidates.push({ latlng: midpoint(f.latlngs), text, weight: style.weight });
      }
    }
  });
  geoLayer = group.addTo(map);

  if (showLabels) {
    placeNonOverlappingLabels(labelCandidates, group);
  }
}

/* ======================================================================
   POPUP S ATRIBUTY A POZNÁMKAMI
   ====================================================================== */
function fmt(n) { return Math.round(n).toLocaleString('cs-CZ'); }

function fmtChange(diff, pct, isNew) {
  const sign = diff > 0 ? '+' : '';
  const diffStr = `${sign}${fmt(diff)}`;
  const pctStr = isNew ? 'nový úsek' : `${sign}${pct.toFixed(1).replace('.', ',')} %`;
  return `${diffStr} (${pctStr})`;
}

function popupHtml(f) {
  const p = f.props;
  const notes = notesByUsek.get(String(f.id)) || [];
  const chg = computeChanges(f);

  const notesHtml = notes.length
    ? notes.map(n => `
        <div class="note-item">
          <div class="meta">${escapeHtml(n.autor || 'Anonym')} · ${formatDate(n.cas)}</div>
          <div>${escapeHtml(n.text)}</div>
        </div>`).join('')
    : `<div class="note-empty">Zatím žádné poznámky.</div>`;

  const savedName = localStorage.getItem('authorName') || '';

  const formHtml = `
    <div class="note-form">
      <input type="text" id="noteAuthor_${f.id}" placeholder="Jméno" value="${escapeHtml(savedName)}">
      <textarea id="noteText_${f.id}" placeholder="Napište poznámku k úseku…"></textarea>
      <button id="noteSubmit_${f.id}">Přidat poznámku</button>
    </div>`;

  return `
    <table class="attr-table">
      <tr><td class="k">Celkem – současný stav</td><td class="v">${fmt(p.total_ss)}</td></tr>
      <tr><td class="k">Celkem – výhled</td><td class="v">${fmt(p.total_vyhl)}</td></tr>
      <tr><td class="k">z toho nad 3,5 t – současný stav</td><td class="v">${fmt(p.heavy_ss)}</td></tr>
      <tr><td class="k">z toho nad 3,5 t – výhled</td><td class="v">${fmt(p.heavy_vyhl)}</td></tr>
      <tr><td class="k">Změna – celkem</td><td class="v">${fmtChange(chg.total.diff, chg.total.pct, chg.total.isNew)}</td></tr>
      <tr><td class="k">Změna – pouze nad 3,5 t</td><td class="v">${fmtChange(chg.heavy.diff, chg.heavy.pct, chg.heavy.isNew)}</td></tr>
    </table>
    <div class="notes-list">${notesHtml}</div>
    ${formHtml}
  `;
}

function openPopup(layer, f) {
  const popup = L.popup({ maxWidth: 320 })
    .setLatLng(layer.getBounds ? layer.getBounds().getCenter() : layer.getLatLngs()[0])
    .setContent(popupHtml(f))
    .openOn(map);

  const btn = document.getElementById(`noteSubmit_${f.id}`);
  if (btn) btn.onclick = () => submitNote(f);
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('cs-CZ') + ' ' + d.toLocaleTimeString('cs-CZ', {hour:'2-digit', minute:'2-digit'});
}

/* ======================================================================
   POZNÁMKY — čtení a zápis přes Google Apps Script Web App
   (appka nikoho nepřihlašuje, Sheet zůstává soukromý pod tvým účtem)
   ====================================================================== */
async function loadNotes() {
  try {
    const res = await fetch(`${CONFIG.APPS_SCRIPT_URL}?action=list`);
    if (!res.ok) { console.warn('Nepodařilo se načíst poznámky', await res.text()); return; }
    const list = await res.json();
    notesByUsek = new Map();
    list.forEach(n => {
      if (!n.usekId) return;
      const arr = notesByUsek.get(String(n.usekId)) || [];
      arr.push({ autor: n.autor, text: n.text, cas: n.cas });
      notesByUsek.set(String(n.usekId), arr);
    });
  } catch (e) {
    console.error(e);
  }
}

async function submitNote(f) {
  const authorInput = document.getElementById(`noteAuthor_${f.id}`);
  const textarea = document.getElementById(`noteText_${f.id}`);
  const autor = authorInput.value.trim();
  const text = textarea.value.trim();
  if (!text) { showToast('Napište text poznámky.'); return; }
  if (!autor) { showToast('Vyplňte prosím jméno.'); return; }

  localStorage.setItem('authorName', autor);
  document.getElementById('authorName').value = autor;

  const btn = document.getElementById(`noteSubmit_${f.id}`);
  btn.disabled = true; btn.textContent = 'Ukládám…';

  try {
    // Content-Type: text/plain schválně, ať Apps Script Web App nevyžaduje
    // CORS preflight (ten Apps Script endpointy nezvládají).
    const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ usekId: String(f.id), autor, text }),
    });
    const result = await res.json().catch(() => ({}));
    if (!res.ok || result.ok === false) throw new Error(result.error || 'Uložení selhalo');

    // okamžitě zobraz i lokálně, bez čekání na reload
    const list = notesByUsek.get(String(f.id)) || [];
    list.push({ autor, text, cas: new Date().toISOString() });
    notesByUsek.set(String(f.id), list);

    redraw();
    map.closePopup();
    showToast('Poznámka uložena.');
  } catch (e) {
    console.error(e);
    showToast('Uložení se nezdařilo. Zkontrolujte nastavení Apps Scriptu.');
    btn.disabled = false; btn.textContent = 'Přidat poznámku';
  }
}

/* ======================================================================
   DROBNOSTI UI
   ====================================================================== */
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

/* ======================================================================
   START
   ====================================================================== */
async function main() {
  initMap();

  const authorNameInput = document.getElementById('authorName');
  authorNameInput.value = localStorage.getItem('authorName') || '';
  authorNameInput.onchange = () => localStorage.setItem('authorName', authorNameInput.value.trim());

  document.getElementById('modeSelect').onchange = (e) => {
    currentMode = e.target.value;
    redraw();
  };
  document.getElementById('vehicleSelect').onchange = (e) => {
    currentVehicle = e.target.value;
    redraw();
  };
  document.getElementById('labelsToggle').onchange = redraw;
  document.getElementById('notesFilter').onchange = redraw;

  try {
    features = await loadCsv();
    document.getElementById('status').textContent = `Načteno ${features.length} úseků.`;
  } catch (e) {
    console.error(e);
    document.getElementById('status').textContent = 'Chyba při načítání CSV.';
    return;
  }

  await loadNotes();

  redraw();
  if (features.length) {
    const bounds = L.latLngBounds(features.flatMap(f => f.latlngs));
    map.fitBounds(bounds, { padding: [20, 20] });
  }
}

main();
</script>
