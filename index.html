<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intenzity dopravy – úseky</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
  :root{
    --panel-bg:#ffffff;
    --border:#dfe3e8;
    --text:#1f2937;
    --muted:#6b7280;
    --accent:#2563eb;
    --accent-dark:#1d4ed8;
  }
  html,body{ margin:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--text); }
  #map{ position:absolute; top:0; bottom:0; left:340px; right:0; }

  #sidebar{
    position:absolute; top:0; bottom:0; left:0; width:340px;
    background:var(--panel-bg); border-right:1px solid var(--border);
    display:flex; flex-direction:column; z-index:1000; overflow-y:auto;
  }
  .sb-section{ padding:14px 16px; border-bottom:1px solid var(--border); }
  .sb-section h1{ font-size:15px; margin:0 0 2px; }
  .sb-section .sub{ font-size:12px; color:var(--muted); margin:0; }
  .sb-section h2{ font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 8px; }

  select, button, input[type=text], textarea{
    font-family:inherit; font-size:13px; border:1px solid var(--border); border-radius:6px;
    padding:7px 9px; width:100%; box-sizing:border-box; background:#fff; color:var(--text);
  }
  button{ cursor:pointer; background:var(--accent); color:#fff; border:none; font-weight:600; }
  button:hover{ background:var(--accent-dark); }
  button.secondary{ background:#fff; color:var(--text); border:1px solid var(--border); }
  button.secondary:hover{ background:#f3f4f6; }
  button:disabled{ opacity:.5; cursor:not-allowed; }

  label.row{ display:flex; align-items:center; gap:8px; font-size:13px; margin:8px 0; cursor:pointer; }
  label.row input{ width:auto; }

  #legend{ font-size:12px; }
  .legend-item{ display:flex; align-items:center; gap:8px; margin:4px 0; }
  .swatch{ width:16px; height:10px; border-radius:2px; flex:none; }

  .field{ margin-bottom:8px; }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:3px; }

  #status{ font-size:12px; color:var(--muted); padding:0 16px 14px; }

  /* Leaflet popup styling */
  .leaflet-popup-content-wrapper{ border-radius:8px; }
  .leaflet-popup-content{ margin:12px 14px; width:280px !important; }
  .popup-title{ font-weight:700; font-size:14px; margin-bottom:6px; }
  table.attr-table{ width:100%; border-collapse:collapse; font-size:12px; margin-bottom:10px; }
  table.attr-table td{ padding:3px 0; }
  table.attr-table td.k{ color:var(--muted); }
  table.attr-table td.v{ text-align:right; font-variant-numeric:tabular-nums; }

  .notes-list{ max-height:150px; overflow-y:auto; margin-bottom:8px; }
  .note-item{ background:#f8f9fb; border-radius:6px; padding:6px 8px; margin-bottom:6px; font-size:12px; }
  .note-item .meta{ color:var(--muted); font-size:11px; margin-bottom:2px; }
  .note-empty{ color:var(--muted); font-size:12px; margin-bottom:8px; }

  .note-form input, .note-form textarea{ margin-bottom:6px; }
  .note-form textarea{ resize:vertical; min-height:50px; }
  .note-form .hint{ font-size:11px; color:var(--muted); margin-bottom:6px; }

  #toast{
    position:absolute; bottom:16px; left:356px; z-index:2000;
    background:#111827; color:#fff; padding:8px 14px; border-radius:6px; font-size:12px;
    opacity:0; transition:opacity .2s; pointer-events:none;
  }
  #toast.show{ opacity:1; }
</style>
</head>
<body>

<div id="sidebar">

  <div class="sb-section">
    <h1>Intenzity dopravy</h1>
    <p class="sub">Vizualizace úseků podle intenzit</p>
  </div>

  <div class="sb-section">
    <h2>Zobrazovaná veličina</h2>
    <select id="metricSelect">
      <option value="total_ss">Celková intenzita – současný stav</option>
      <option value="total_vyhl">Celková intenzita – výhledový stav</option>
      <option value="heavy_ss">Nákladní vozidla (&gt;3,5 t) – současný stav</option>
      <option value="heavy_vyhl">Nákladní vozidla (&gt;3,5 t) – výhledový stav</option>
      <option value="total_diff">Rozdíl celkové intenzity (výhled − současnost)</option>
      <option value="heavy_diff">Rozdíl nákladních vozidel (výhled − současnost)</option>
    </select>

    <label class="row">
      <input type="checkbox" id="notesFilter">
      Zobrazit jen úseky s poznámkou
    </label>
  </div>

  <div class="sb-section">
    <h2>Legenda</h2>
    <div id="legend"></div>
  </div>

  <div class="sb-section">
    <h2>Vaše jméno</h2>
    <div class="field">
      <input type="text" id="authorName" placeholder="Jméno (zobrazí se u vašich poznámek)">
    </div>
    <p class="sub" style="margin-top:6px;">Jméno se uloží jen v tomto prohlížeči a předvyplní se u nových poznámek.</p>
  </div>

  <div style="flex:1"></div>
  <div id="status">Načítám data…</div>
</div>

<div id="map"></div>
<div id="toast"></div>

<script>
/* ======================================================================
   KONFIGURACE — uprav před nasazením
   ====================================================================== */
const CONFIG = {
  // Cesta k CSV souboru s úseky (relativně k index.html)
  CSV_URL: 'data.csv',

  // URL nasazeného Google Apps Script Web Appu (viz README / Code.gs).
  // Appka přes ni čte i zapisuje poznámky - Sheet samotný zůstává
  // soukromý, přístup k němu má jen tvůj Google účet, pod kterým je
  // skript nasazený.
  APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbzDhFA4JkzN71s0HgWbqbMO3B4REHu3-td4mLHk0Y0IbQixH5G3PnfJ9LucWWwpnYiEfQ/exec',

  MAP_CENTER: [50.045, 14.47],
  MAP_ZOOM: 12,
};

/* ======================================================================
   STAV APLIKACE
   ====================================================================== */
let map, geoLayer;
let features = [];              // pole {id, props:{...}, latlngs:[...]}
let notesByUsek = new Map();    // UsekId -> [ {autor, text, cas} ]
let currentMetric = 'total_ss';

const RAMP = ['#ffffb2', '#fecc5c', '#fd8d3c', '#f03b20', '#bd0026'];
const DIFF_RAMP_NEG = '#2166ac';
const DIFF_RAMP_POS = '#b2182b';

/* ======================================================================
   NAČTENÍ A PARSOVÁNÍ CSV
   ====================================================================== */
function parseNumber(s) {
  if (s === undefined || s === null) return 0;
  const cleaned = String(s).replace(/\s|\u00a0/g, '').replace(',', '.');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

// WKT "LINESTRING(lon lat,lon lat,...)" -> pole [lat,lon] pro Leaflet
function wktLineToLatLngs(wkt) {
  const inner = wkt.replace(/^LINESTRING\s*\(/i, '').replace(/\)\s*$/, '');
  return inner.split(',').map(pair => {
    const [lon, lat] = pair.trim().split(/\s+/).map(Number);
    return [lat, lon];
  });
}

function loadCsv() {
  return new Promise((resolve, reject) => {
    Papa.parse(CONFIG.CSV_URL, {
      download: true,
      delimiter: ';',
      complete: (result) => {
        try {
          // první řádek je hlavička (i když neobvykle pojmenovaná) -> přeskočit
          const parsed = result.data.slice(1)
            .filter(r => r.length >= 7 && r[6] && r[6].trim().length > 0)
            .map(r => {
              const props = {
                id: r[1].trim(),                 // sloupec "No" v hlavičce = skutečné ID úseku
                total_ss: parseNumber(r[2]),
                total_vyhl: parseNumber(r[3]),
                heavy_ss: parseNumber(r[4]),
                heavy_vyhl: parseNumber(r[5]),
              };
              props.total_diff = props.total_vyhl - props.total_ss;
              props.heavy_diff = props.heavy_vyhl - props.heavy_ss;
              return { id: props.id, props, latlngs: wktLineToLatLngs(r[6]) };
            });
          resolve(parsed);
        } catch (e) { reject(e); }
      },
      error: reject,
    });
  });
}

/* ======================================================================
   KLASIFIKACE A BARVY
   ====================================================================== */
function computeBreaks(values, classes = 5) {
  const sorted = [...values].sort((a, b) => a - b);
  const breaks = [];
  for (let i = 1; i < classes; i++) {
    const idx = Math.floor((sorted.length - 1) * (i / classes));
    breaks.push(sorted[idx]);
  }
  return breaks; // 4 breakpointy => 5 tříd
}

function colorForValue(value, breaks, isDiff) {
  if (isDiff) {
    return value >= 0 ? DIFF_RAMP_POS : DIFF_RAMP_NEG;
  }
  let cls = 0;
  while (cls < breaks.length && value > breaks[cls]) cls++;
  return RAMP[cls];
}

function weightForValue(value, maxAbsAllValues) {
  const w = 2 + (Math.abs(value) / (maxAbsAllValues || 1)) * 7;
  return Math.max(2, Math.min(9, w));
}

function styleForMetric() {
  const isDiff = currentMetric.endsWith('_diff');
  const values = features.map(f => f.props[currentMetric]);
  const breaks = isDiff ? [] : computeBreaks(values);
  const maxAbs = Math.max(...values.map(Math.abs), 1);

  renderLegend(isDiff, breaks, maxAbs, values);

  return function (feature) {
    const v = feature.props[currentMetric];
    return {
      color: colorForValue(v, breaks, isDiff),
      weight: weightForValue(v, maxAbs),
      opacity: 0.9,
    };
  };
}

function renderLegend(isDiff, breaks, maxAbs, values) {
  const el = document.getElementById('legend');
  el.innerHTML = '';
  if (isDiff) {
    const rows = [
      [DIFF_RAMP_POS, 'Nárůst (výhled > současnost)'],
      [DIFF_RAMP_NEG, 'Pokles (výhled < současnost)'],
    ];
    rows.forEach(([color, label]) => {
      el.insertAdjacentHTML('beforeend',
        `<div class="legend-item"><span class="swatch" style="background:${color}"></span>${label}</div>`);
    });
    el.insertAdjacentHTML('beforeend',
      `<div class="legend-item" style="color:var(--muted)">Tloušťka linie = velikost změny</div>`);
    return;
  }
  const min = Math.min(...values);
  const edges = [min, ...breaks, Math.max(...values)];
  for (let i = 0; i < RAMP.length; i++) {
    const from = Math.round(edges[i]);
    const to = Math.round(edges[i + 1]);
    el.insertAdjacentHTML('beforeend',
      `<div class="legend-item"><span class="swatch" style="background:${RAMP[i]}"></span>${from.toLocaleString('cs-CZ')} – ${to.toLocaleString('cs-CZ')}</div>`);
  }
}

/* ======================================================================
   VYKRESLENÍ MAPY
   ====================================================================== */
function initMap() {
  map = L.map('map').setView(CONFIG.MAP_CENTER, CONFIG.MAP_ZOOM);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors',
  }).addTo(map);
}

function passesNotesFilter(f) {
  if (!document.getElementById('notesFilter').checked) return true;
  const notes = notesByUsek.get(String(f.id)) || [];
  return notes.length > 0;
}

function redraw() {
  const styleFn = styleForMetric();
  if (geoLayer) map.removeLayer(geoLayer);

  const group = L.layerGroup();
  features.forEach(f => {
    if (!passesNotesFilter(f)) return;
    const style = styleFn(f);
    const hasNotes = (notesByUsek.get(String(f.id)) || []).length > 0;
    if (hasNotes) {
      // vizuální odlišení úseků s poznámkou: jemný obrys navrch
      L.polyline(f.latlngs, { color: '#111827', weight: style.weight + 3, opacity: 0.15 }).addTo(group);
    }
    const line = L.polyline(f.latlngs, style);
    line.on('click', () => openPopup(line, f));
    line.addTo(group);
  });
  geoLayer = group.addTo(map);
}

/* ======================================================================
   POPUP S ATRIBUTY A POZNÁMKAMI
   ====================================================================== */
function fmt(n) { return Math.round(n).toLocaleString('cs-CZ'); }

function popupHtml(f) {
  const p = f.props;
  const notes = notesByUsek.get(String(f.id)) || [];

  const notesHtml = notes.length
    ? notes.map(n => `
        <div class="note-item">
          <div class="meta">${escapeHtml(n.autor || 'Anonym')} · ${formatDate(n.cas)}</div>
          <div>${escapeHtml(n.text)}</div>
        </div>`).join('')
    : `<div class="note-empty">Zatím žádné poznámky.</div>`;

  const savedName = localStorage.getItem('authorName') || '';

  const formHtml = `
    <div class="note-form">
      <input type="text" id="noteAuthor_${f.id}" placeholder="Jméno" value="${escapeHtml(savedName)}">
      <textarea id="noteText_${f.id}" placeholder="Napište poznámku k úseku…"></textarea>
      <button id="noteSubmit_${f.id}">Přidat poznámku</button>
    </div>`;

  return `
    <div class="popup-title">Úsek č. ${escapeHtml(f.id)}</div>
    <table class="attr-table">
      <tr><td class="k">Celkem – současný stav</td><td class="v">${fmt(p.total_ss)}</td></tr>
      <tr><td class="k">Celkem – výhled</td><td class="v">${fmt(p.total_vyhl)}</td></tr>
      <tr><td class="k">Nákladní – současný stav</td><td class="v">${fmt(p.heavy_ss)}</td></tr>
      <tr><td class="k">Nákladní – výhled</td><td class="v">${fmt(p.heavy_vyhl)}</td></tr>
    </table>
    <div class="notes-list">${notesHtml}</div>
    ${formHtml}
  `;
}

function openPopup(layer, f) {
  const popup = L.popup({ maxWidth: 320 })
    .setLatLng(layer.getBounds ? layer.getBounds().getCenter() : layer.getLatLngs()[0])
    .setContent(popupHtml(f))
    .openOn(map);

  const btn = document.getElementById(`noteSubmit_${f.id}`);
  if (btn) btn.onclick = () => submitNote(f);
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('cs-CZ') + ' ' + d.toLocaleTimeString('cs-CZ', {hour:'2-digit', minute:'2-digit'});
}

/* ======================================================================
   POZNÁMKY — čtení a zápis přes Google Apps Script Web App
   (appka nikoho nepřihlašuje, Sheet zůstává soukromý pod tvým účtem)
   ====================================================================== */
async function loadNotes() {
  try {
    const res = await fetch(`${CONFIG.APPS_SCRIPT_URL}?action=list`);
    if (!res.ok) { console.warn('Nepodařilo se načíst poznámky', await res.text()); return; }
    const list = await res.json();
    notesByUsek = new Map();
    list.forEach(n => {
      if (!n.usekId) return;
      const arr = notesByUsek.get(String(n.usekId)) || [];
      arr.push({ autor: n.autor, text: n.text, cas: n.cas });
      notesByUsek.set(String(n.usekId), arr);
    });
  } catch (e) {
    console.error(e);
  }
}

async function submitNote(f) {
  const authorInput = document.getElementById(`noteAuthor_${f.id}`);
  const textarea = document.getElementById(`noteText_${f.id}`);
  const autor = authorInput.value.trim();
  const text = textarea.value.trim();
  if (!text) { showToast('Napiš text poznámky.'); return; }
  if (!autor) { showToast('Vyplň prosím jméno.'); return; }

  localStorage.setItem('authorName', autor);
  document.getElementById('authorName').value = autor;

  const btn = document.getElementById(`noteSubmit_${f.id}`);
  btn.disabled = true; btn.textContent = 'Ukládám…';

  try {
    // Content-Type: text/plain schválně, ať Apps Script Web App nevyžaduje
    // CORS preflight (ten Apps Script endpointy nezvládají).
    const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ usekId: String(f.id), autor, text }),
    });
    const result = await res.json().catch(() => ({}));
    if (!res.ok || result.ok === false) throw new Error(result.error || 'Uložení selhalo');

    // okamžitě zobraz i lokálně, bez čekání na reload
    const list = notesByUsek.get(String(f.id)) || [];
    list.push({ autor, text, cas: new Date().toISOString() });
    notesByUsek.set(String(f.id), list);

    redraw();
    map.closePopup();
    showToast('Poznámka uložena.');
  } catch (e) {
    console.error(e);
    showToast('Uložení se nezdařilo. Zkontroluj nastavení Apps Scriptu.');
    btn.disabled = false; btn.textContent = 'Přidat poznámku';
  }
}

/* ======================================================================
   DROBNOSTI UI
   ====================================================================== */
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

/* ======================================================================
   START
   ====================================================================== */
async function main() {
  initMap();

  const authorNameInput = document.getElementById('authorName');
  authorNameInput.value = localStorage.getItem('authorName') || '';
  authorNameInput.onchange = () => localStorage.setItem('authorName', authorNameInput.value.trim());

  document.getElementById('metricSelect').onchange = (e) => {
    currentMetric = e.target.value;
    redraw();
  };
  document.getElementById('notesFilter').onchange = redraw;

  try {
    features = await loadCsv();
    document.getElementById('status').textContent = `Načteno ${features.length} úseků.`;
  } catch (e) {
    console.error(e);
    document.getElementById('status').textContent = 'Chyba při načítání CSV.';
    return;
  }

  await loadNotes();

  redraw();
  if (features.length) {
    const bounds = L.latLngBounds(features.flatMap(f => f.latlngs));
    map.fitBounds(bounds, { padding: [20, 20] });
  }
}

main();
</script>
</body>
</html>
